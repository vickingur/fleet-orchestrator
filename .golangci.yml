version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: unused-parameter
formatters:
  enable:
    - gofmt
